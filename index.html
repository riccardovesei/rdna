<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi - Account Google</title>
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f0f4f9;
      color: #1f1f1f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card principale */
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 448px;
      padding: 40px 40px 36px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
    }

    /* Logo Google SVG */
    .logo-container {
      display: flex;
      margin-bottom: 16px;
    }

    .google-logo {
      width: 48px;
      height: 48px;
    }

    /* Titoli */
    h1 {
      font-family: 'Google Sans', 'Roboto', sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.3333;
      color: #1f1f1f;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: #444746;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* Floating Label Input (Material Design) */
    .input-group {
      position: relative;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      height: 56px;
      padding: 16px;
      font-size: 16px;
      border: 1px solid #747775;
      border-radius: 4px;
      outline: none;
      background-color: transparent;
      color: #1f1f1f;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: #0b57d0;
      border-width: 2px;
      padding: 15px; /* Compensa il bordo da 2px */
    }

    .input-group label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #444746;
      pointer-events: none;
      background: #ffffff;
      padding: 0 4px;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Quando l'input è a fuoco o contiene testo */
    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: 0;
      font-size: 12px;
      color: #0b57d0;
    }

    .input-group input:not(:focus):not(:placeholder-shown) ~ label {
      color: #444746;
    }

    /* Link generici */
    a {
      color: #0b57d0;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      display: inline-block;
    }

    a:hover {
      text-decoration: underline;
    }

    .forgot-link {
      margin-bottom: 28px;
    }

    /* Testo informativo modalità ospite */
    .guest-info {
      font-size: 14px;
      color: #444746;
      line-height: 1.43;
      margin-bottom: 32px;
    }

    /* Azioni (Bottoni inferiori) */
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-create {
      background: transparent;
      border: none;
      color: #0b57d0;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-create:hover {
      background-color: #edf2fa;
    }

    .btn-next {
      background-color: #0b57d0;
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 24px;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .btn-next:hover {
      background-color: #0842a0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* Footer lingua e privacy */
    .footer {
      width: 100%;
      max-width: 448px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #444746;
    }

    .language-select {
      background: transparent;
      border: none;
      font-size: 12px;
      color: #444746;
      padding: 4px 8px;
      cursor: pointer;
      outline: none;
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-links a {
      color: #444746;
      font-size: 12px;
      font-weight: 400;
    }

    .footer-links a:hover {
      color: #1f1f1f;
      text-decoration: underline;
    }

    /* Responsive per schermi molto piccoli */
    @media (max-width: 480px) {
      body {
        background-color: #ffffff;
        padding: 16px;
        justify-content: flex-start;
      }

      .login-card {
        padding: 24px 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Contenitore Principale (Card di login) -->
  <main class="login-card">
    <div class="logo-container">
      <!-- Icona ufficiale SVG a 4 colori di Google -->
      <svg class="google-logo" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    </div>

    <h1>Accedi</h1>
    <p class="subtitle">Utilizza il tuo Account Google</p>

    <form id="loginForm" onsubmit="handleFormSubmit(event)">
      <!-- Input Material con Floating Label -->
      <div class="input-group">
        <input type="text" id="email" placeholder=" " autocomplete="username" required>
        <label for="email">Email o telefono</label>
      </div>

      <div class="forgot-link">
        <a href="#">Non ricordi l'indirizzo email?</a>
      </div>

      <div class="guest-info">
        Non è il tuo computer? Usa la modalità ospite per accedere privatamente.
        <br>
        <a href="#">Ulteriori informazioni sulla modalità ospite</a>
      </div>

      <!-- Pulsanti Crea Account / Avanti -->
      <div class="actions">
        <button type="button" class="btn-create" onclick="alert('Redirect alla creazione dell\'account')">Crea un account</button>
        <button type="submit" class="btn-next">Avanti</button>
      </div>
    </form>
  </main>

  <!-- Footer con lingua e link di servizio -->
  <footer class="footer">
    <select class="language-select" aria-label="Seleziona la lingua">
      <option value="it" selected>Italiano (Italia)</option>
      <option value="en">English (United States)</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
    </select>

    <div class="footer-links">
      <a href="#">Guida</a>
      <a href="#">Privacy</a>
      <a href="#">Termini</a>
    </div>
  </footer>

  <script>
    function handleFormSubmit(event) {
      event.preventDefault();
      const emailInput = document.getElementById('email');
      const emailValue = emailInput.value.trim();

      if (!emailValue) {
        alert('Inserisci un indirizzo email o un numero di telefono.');
        emailInput.focus();
        return;
      }

      // Simulazione transizione al passaggio successivo (richiesta password)
      console.log('Procedo al passaggio successivo per:', emailValue);
      alert('Email inserita: ' + emailValue + '\n(Simulazione: passaggio al campo Password)');
    }
  </script>
</body>
</html>
